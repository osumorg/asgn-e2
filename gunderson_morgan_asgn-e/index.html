<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
	
<style>
	
	#wrapper{
		min-width: 375px;
		max-width: 1000px;
		margin-left: auto;
		margin-right: auto;
	}
	
	html{
		background-color: #2F191A;
	}
	
	div{
		background-color: #CECECE;
		align-content: center;
		max-width: 1000px;
		padding-left: 10px;
		padding-right: 10px;
		padding-bottom: 10px;
		padding-top: 10px;
	}
	
	header{
		display: flex;
		height: 100px;
        margin-bottom: 10px;
        margin-bottom: 10px; 
		grid-area: header; 
		background-color: #2F191A;
		color: white;
		padding-left: 10px;
	}
	
	nav {
        background-color: darkred;
         
		grid-area: nav;
    }
    
	main {
        background-color: #CCC6C6;
        margin-bottom: 10px; 
		grid-area: main;
		padding-left: 10px;
    } 
    
	article {
        background-color: #F5AAAB;
        margin-bottom: 10px; 
		grid-area: article;
    }
	img{
		display: flex;
		width: 1000px;
	}
	
	h1{
		display: flex;
		justify-content: center;
        font size: 133%;
		background-color: white;
		border: medium solid #000000;
	}
	
@media screen and (min-width: 784px){
			article { 
			float: left;
			width: 60%;
			}
			aside {
			float: right;
			width: 30%;
			}
			footer {
			clear:both;}
	}
	
	
	.black{
		padding-left:50px;
	}
	.white{
		padding-left: 10px;
		padding-right: 10px;
	}
	.title{
		align-content: flex-start;
	}
	.subtitle{
		
		
	}
	.logo{
		display: flex;
		align-content: flex-end;
		width:150px;
	}
	
.topnav {
	overflow: hidden;
	background-color: #440203;
} /* This was the code I borrowed from w3schools */

.topnav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

.topnav a:hover {
  background-color: #ddd;
  color: black;
}

.topnav a.active {
	background-color: #A30404;
	color: white;
}

.topnav .icon {
	display: none;
}

@media screen and (max-width: 784px) { /* This was the code I borrowed from w3schools */
  .topnav a:not(:first-child) {display: none;}
  .topnav a.icon {
    float: right;
    display: block;
  }
}

@media screen and (max-width: 784px) { /* This was the code I borrowed from w3schools */
  .topnav.responsive {position: relative;}
  .topnav.responsive .icon {
    position: absolute;
    right: 0;
    top: 0;
  }
  .topnav.responsive a {
    float: none;
    display: block;
    text-align: left;
  }
}

	
</style>	
	
</head>
<body>
<div id="wrapper">
	
<header>
	<img class="logo" src="links/website-logo-white.png" width="100%"> 
</header>
	
	
<nav class="topnav" id="myTopnav">
  <a href="javascript:void(0);" class="icon" onclick="myFunction()">
    <i class="fa fa-bars"></i>
  </a>
	<a href="index.html">Home</a> <a href="page2.html">About</a> <a href="page3.html">Works</a> <a href="page4.html">Learn More</a>
</nav>

	<h1 class="title">NEVILLE BRODY</h1>
	
<article> <img src="links/neville-brody-portrait.png"> </article>
<footer>
	<figcaption><em>Image by Chris Garnham</em></figcaption>
	</footer>

</div>
	
<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
</body>
</html>
